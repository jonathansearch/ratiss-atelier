[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-atelier"
version = "1.0.0"
description = "Atelier de fabrication souverain (impression 3D + CNC + FEM) — Priorité 4 RATISS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jonathan Evina", email = "samajonathan9@gmail.com"},
    {name = "JOHNKING0"},
]
keywords = ["impression 3D", "CNC", "FEM", "fabrication", "souveraineté", "Cameroun"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
test = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/samajonathan9-source/ratiss-atelier"
Repository = "https://github.com/samajonathan9-source/ratiss-atelier"

[tool.setuptools.packages.find]
include = ["ratiss_atelier*"]
